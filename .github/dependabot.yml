version: 2

updates:
  # As actions são o alvo mais fácil da cadeia: rodam com o `GITHUB_TOKEN` do
  # repositório e quase ninguém as atualiza. Como os workflows daqui prendem
  # cada action por SHA, é o Dependabot que traz o SHA novo junto com a versão
  # a que ele corresponde.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Atualiza"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Atualiza"
    groups:
      # Uma PR por grupo em vez de uma por pacote. Atualização de segurança
      # continua vindo separada e na hora, sem esperar a segunda-feira.
      #
      # Família que é publicada junto sobe junto, mesmo com uma parte em
      # produção e outra em desenvolvimento. Separadas, uma PR atualizou o
      # @tanstack/router-plugin sem o @tanstack/react-router e deixou a
      # dependência par quebrada. O Dependabot põe cada pacote no primeiro
      # grupo que casa, por isso as famílias vêm antes dos grupos por tipo.
      tanstack:
        patterns: ["@tanstack/*"]
        update-types: [minor, patch]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: [minor, patch]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
