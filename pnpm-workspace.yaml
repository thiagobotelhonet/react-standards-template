packages: []

# Espera um dia antes de considerar uma versão recém-publicada. Quase todo
# pacote comprometido é descoberto e despublicado em horas; esta espera é o
# que separa "atualizei na hora errada" de "não atualizei". Não afeta
# instalação com lockfile, onde a versão já está decidida.
minimumReleaseAge: 1440

# Sem esta linha o pnpm trata a espera como erro duro em vez de cair para a
# versão anterior. O Dependabot re-resolve a árvore inteira a cada dependência,
# então um único pacote transitivo dentro da janela derruba a atualização de
# todos. O pnpm 10.33 daqui ainda não conhece a chave e a ignora; quem a lê é o
# pnpm mais novo que o Dependabot usa.
minimumReleaseAgeStrict: false

# O @vitest/mocker 5.0.3 declara o msw 2 como dependência opcional e só o usa
# no modo navegador do Vitest; aqui os testes rodam em jsdom e chamam o msw
# direto. O 5.0.4 já aceita o msw 3. Remova este bloco quando o Vitest chegar
# à 5.0.4.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker>msw": "3"

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  msw: false
